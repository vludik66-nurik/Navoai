<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nova — ИИ-чат</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E✦%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#0e0919;--side:#130c24;--panel:#1a1230;--panel2:#221845;--line:#2e2354;--text:#ede8fb;--mute:#9a8fc0;--acc:#8b5cf6;--acc2:#a78bfa;--err:#f87171;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;overflow:hidden}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.app{display:flex;height:100dvh}
.side{width:268px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px;gap:8px;flex-shrink:0;transition:transform .2s}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 10px;font-weight:650;font-size:18px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#a78bfa,#6d28d9);display:grid;place-items:center;font-size:16px;color:#fff}
.btn{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border-radius:10px;text-align:left}
.btn:hover{background:var(--panel)}
.btn.new{border:1px solid var(--line);background:var(--panel)}
.btn.new:hover{background:var(--panel2)}
.list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin:6px -4px;padding:0 4px}
.item{display:flex;align-items:center;border-radius:10px;padding:0 4px 0 12px;color:var(--mute)}
.item:hover,.item.on{background:var(--panel);color:var(--text)}
.item span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:8px 0;cursor:pointer;font-size:14.5px}
.item button{color:var(--mute);padding:6px 8px;border-radius:8px;opacity:0}
.item:hover button,.item.on button{opacity:1}
.item button:hover{color:var(--err)}
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.top{display:flex;align-items:center;gap:8px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--bg)}
.top .menu{display:none;padding:6px 10px;font-size:20px;border-radius:8px}
select{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;max-width:46vw;min-width:0}
select:hover{border-color:var(--acc)}
select option{background:var(--panel)}
.icon{padding:7px 11px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.icon:hover{border-color:var(--acc)}
.sp{flex:1}
.msgs{flex:1;overflow-y:auto;scroll-behavior:smooth}
.col{max-width:760px;margin:0 auto;padding:24px 18px 12px}
.hero{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 18px;gap:10px}
.hero .logo{width:56px;height:56px;font-size:28px;border-radius:16px;box-shadow:0 10px 40px #8b5cf655}
.hero h1{font-size:30px;font-weight:650;letter-spacing:-.02em}
.hero p{color:var(--mute);max-width:440px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;max-width:620px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;font-size:14.5px}
.chip:hover{border-color:var(--acc);background:var(--panel2)}
.m{display:flex;margin:0 0 22px}
.m.user{justify-content:flex-end}
.m.user .b{background:var(--panel2);border:1px solid var(--line);border-radius:18px 18px 4px 18px;padding:10px 16px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.m.bot{gap:12px;align-items:flex-start}
.m.bot .logo{width:28px;height:28px;font-size:14px;margin-top:2px;flex-shrink:0}
.m.bot .w{min-width:0;flex:1}
.who{font-size:13px;color:var(--mute);margin-bottom:2px}
.b.md{overflow-wrap:anywhere}
.md>*:first-child{margin-top:0}.md>*:last-child{margin-bottom:0}
.md p,.md ul,.md ol,.md pre,.md blockquote,.md table{margin:.7em 0}
.md ul,.md ol{padding-left:1.4em}
.md li{margin:.2em 0}
.md h1,.md h2,.md h3{margin:1em 0 .4em;line-height:1.3}
.md h1{font-size:1.4em}.md h2{font-size:1.2em}.md h3{font-size:1.05em}
.md a{color:var(--acc2)}
.md code{background:var(--panel2);padding:.12em .4em;border-radius:6px;font:.9em ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.md pre{background:#0a0614;border:1px solid var(--line);border-radius:12px;padding:12px 14px;overflow-x:auto}
.md pre code{background:none;padding:0}
.md blockquote{border-left:3px solid var(--acc);padding-left:12px;color:var(--mute)}
.md table{border-collapse:collapse;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:6px 10px}
.md th{background:var(--panel)}
.err{color:var(--err);white-space:pre-wrap}
.act{margin-top:6px;display:flex;gap:4px}
.act button{color:var(--mute);font-size:13px;padding:4px 8px;border-radius:8px}
.act button:hover{background:var(--panel);color:var(--text)}
.dots{display:inline-flex;gap:4px;padding:8px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--acc2);animation:bl 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.comp{padding:8px 14px calc(14px + env(safe-area-inset-bottom))}
.box{max-width:760px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:8px 8px 8px 18px}
.box:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px #8b5cf626}
textarea{flex:1;background:none;border:0;resize:none;outline:0;max-height:200px;padding:7px 0;line-height:1.5}
textarea::placeholder{color:var(--mute)}
.send{width:38px;height:38px;border-radius:50%;background:var(--acc);color:#fff;font-size:18px;flex-shrink:0;display:grid;place-items:center}
.send:hover{background:#7c3aed}
.send:disabled{background:var(--panel2);color:var(--mute);cursor:not-allowed}
.hint{text-align:center;color:var(--mute);font-size:12px;margin-top:8px}
.ov{position:fixed;inset:0;background:#05020ccc;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.ov.on{display:flex}
.dlg{background:var(--side);border:1px solid var(--line);border-radius:18px;width:100%;max-width:540px;max-height:92dvh;overflow-y:auto;padding:22px}
.dlg h2{font-size:20px;margin-bottom:4px}
.dlg .sub{color:var(--mute);font-size:14px;margin-bottom:16px}
.dlg label{display:block;font-size:14px;margin:14px 0 5px;font-weight:600}
.dlg label a{color:var(--acc2);font-weight:400;font-size:13px;margin-left:6px}
.dlg input,.dlg textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.dlg textarea{min-height:110px;resize:vertical;max-height:none}
.dlg input:focus,.dlg textarea:focus{outline:0;border-color:var(--acc)}
.row{display:flex;gap:8px;justify-content:space-between;margin-top:20px;flex-wrap:wrap}
.pri{background:var(--acc);color:#fff;border-radius:10px;padding:9px 20px;font-weight:600}
.pri:hover{background:#7c3aed}
.sec{border:1px solid var(--line);border-radius:10px;padding:9px 16px}
.sec:hover{background:var(--panel)}
.dng{color:var(--err)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--acc);padding:9px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.scrim{display:none}
@media(max-width:820px){
 .side{position:fixed;inset:0 auto 0 0;z-index:15;transform:translateX(-100%);padding-top:max(12px,env(safe-area-inset-top))}
 .side.open{transform:none}
 .scrim.open{display:block;position:fixed;inset:0;background:#05020c99;z-index:14}
 .top .menu{display:block}
 .hero h1{font-size:25px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><div class="logo">✦</div>Nova</div>
    <button class="btn new" id="newBtn">＋ Новый чат</button>
    <div class="list" id="list"></div>
    <button class="btn" id="setBtn">⚙ Настройки и ключи</button>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <div class="top">
      <button class="menu" id="menu" aria-label="Меню">☰</button>
      <select id="prov" aria-label="Провайдер"></select>
      <select id="model" aria-label="Модель"></select>
      <button class="icon" id="refresh" title="Обновить список моделей" aria-label="Обновить список моделей">↻</button>
      <span class="sp"></span>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="comp">
      <div class="box">
        <textarea id="inp" rows="1" placeholder="Напиши сообщение Nova…" aria-label="Сообщение"></textarea>
        <button class="send" id="send" aria-label="Отправить">↑</button>
      </div>
      <div class="hint">Enter — отправить, Shift+Enter — новая строка. Nova может ошибаться, важное проверяй.</div>
    </div>
  </main>
</div>

<div class="ov" id="ov">
  <div class="dlg" role="dialog" aria-label="Настройки">
    <h2>Настройки</h2>
    <p class="sub">Ключи хранятся только в твоём браузере и никуда, кроме выбранного ИИ-сервиса, не отправляются.</p>
    <label>Google Gemini <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">получить бесплатный ключ</a></label>
    <input id="k_gemini" type="password" autocomplete="off" placeholder="AIza…">
    <label>OpenRouter — бесплатные Qwen и другие <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">получить ключ</a></label>
    <input id="k_openrouter" type="password" autocomplete="off" placeholder="sk-or-…">
    <label>Groq — быстрый, есть Qwen <a href="https://console.groq.com/keys" target="_blank" rel="noopener">получить ключ</a></label>
    <input id="k_groq" type="password" autocomplete="off" placeholder="gsk_…">
    <label>Системный промт Nova</label>
    <textarea id="prompt"></textarea>
    <div class="row">
      <button class="sec dng" id="wipe">Удалить все данные</button>
      <span style="display:flex;gap:8px"><button class="sec" id="reset">Промт по умолчанию</button><button class="pri" id="save">Сохранить</button></span>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
"use strict";
const DEFAULT_PROMPT = "Ты — новая нейросеть с названием Nova. Твоя цель — отвечать очень точно и хорошо думать. Перед ответом внимательно разбери вопрос и проверь свои рассуждения. Не выдумывай факты: если чего-то не знаешь или не уверена, так и скажи. Отвечай на том языке, на котором пишет пользователь, чётко и по делу.";
const PROV = {
  gemini: {name: "Google Gemini", models: ["gemini-3.8-flash", "gemini-3.6-flash", "gemini-3.1-flash-lite"]},
  openrouter: {name: "OpenRouter (Qwen)", models: ["qwen/qwen3-next-80b-a3b-instruct:free", "openrouter/free"]},
  groq: {name: "Groq (Qwen / Llama)", models: ["qwen/qwen3-32b", "llama-3.3-70b-versatile"]}
};
const LS = "nova.v1";
const $ = s => document.querySelector(s);
let S = {keys: {}, provider: "gemini", model: {}, prompt: DEFAULT_PROMPT, chats: [], cur: null};
try { Object.assign(S, JSON.parse(localStorage.getItem(LS) || "{}")); } catch (e) {}
S.keys = Object.assign({gemini: "", openrouter: "", groq: ""}, S.keys);
S.model = S.model || {};
if (!PROV[S.provider]) S.provider = "gemini";
if (!S.prompt) S.prompt = DEFAULT_PROMPT;
if (!Array.isArray(S.chats)) S.chats = [];
const save = () => { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} };
const LIST = {};
let busy = false, ctrl = null;

const esc = t => t.replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2600); }
if (window.DOMPurify) DOMPurify.addHook("afterSanitizeAttributes", n => { if (n.tagName === "A") { n.setAttribute("target", "_blank"); n.setAttribute("rel", "noopener noreferrer"); } });
function md(t) {
  t = t.replace(/<think>[\s\S]*?(<\/think>|$)/g, "").trim();
  if (window.marked && window.DOMPurify) {
    try { return DOMPurify.sanitize(marked.parse(t, {breaks: true, gfm: true})); } catch (e) {}
  }
  return esc(t).replace(/\n/g, "<br>");
}

/* ---------- провайдеры и модели ---------- */
const models = p => LIST[p] || PROV[p].models;
function fillProv() {
  $("#prov").innerHTML = Object.keys(PROV).map(k => `<option value="${k}">${PROV[k].name}</option>`).join("");
  $("#prov").value = S.provider;
}
function fillModels() {
  const p = S.provider, l = models(p);
  if (!l.includes(S.model[p])) S.model[p] = l[0];
  $("#model").innerHTML = l.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join("");
  $("#model").value = S.model[p];
  save();
}
async function loadModels(p, quiet) {
  const key = S.keys[p].trim();
  try {
    let ids = [];
    if (p === "gemini") {
      if (!key) throw new Error("Нужен ключ Gemini");
      const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key=" + encodeURIComponent(key));
      if (!r.ok) throw new Error("Ключ не подошёл (" + r.status + ")");
      const j = await r.json();
      ids = (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent") && /gemini|gemma/i.test(m.name) && !/image|tts|embed|live|audio|robotics|computer|aqa|vision/i.test(m.name)).map(m => m.name.replace(/^models\//, ""));
      ids.sort((a, b) => (/flash/.test(b) - /flash/.test(a)) || b.localeCompare(a, "en", {numeric: true}));
    } else if (p === "openrouter") {
      const r = await fetch("https://openrouter.ai/api/v1/models");
      if (!r.ok) throw new Error("Ошибка " + r.status);
      const j = await r.json();
      ids = (j.data || []).map(m => m.id).filter(id => id.endsWith(":free") && !/image|audio/i.test(id));
      ids.sort((a, b) => (/qwen/i.test(b) - /qwen/i.test(a)) || a.localeCompare(b));
      ids.unshift("openrouter/free");
    } else {
      if (!key) throw new Error("Нужен ключ Groq");
      const r = await fetch("https://api.groq.com/openai/v1/models", {headers: {Authorization: "Bearer " + key}});
      if (!r.ok) throw new Error("Ключ не подошёл (" + r.status + ")");
      const j = await r.json();
      ids = (j.data || []).map(m => m.id).filter(id => !/whisper|tts|guard|orpheus|playai|embed/i.test(id));
      ids.sort((a, b) => (/qwen/i.test(b) - /qwen/i.test(a)) || a.localeCompare(b));
    }
    if (!ids.length) throw new Error("Список пуст");
    LIST[p] = ids;
    if (p === S.provider) fillModels();
    if (!quiet) toast("Моделей найдено: " + ids.length);
  } catch (e) {
    if (!quiet) toast("Не удалось обновить список: " + e.message);
  }
}

/* ---------- чаты ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const chat = () => S.chats.find(c => c.id === S.cur);
function newChat() {
  if (busy) return;
  S.cur = null; save(); renderList(); renderMsgs(); closeSide(); $("#inp").focus();
}
function renderList() {
  const l = $("#list"); l.innerHTML = "";
  S.chats.slice().sort((a, b) => b.ts - a.ts).forEach(c => {
    const d = document.createElement("div"); d.className = "item" + (c.id === S.cur ? " on" : "");
    const s = document.createElement("span"); s.textContent = c.title; s.onclick = () => { if (busy) return; S.cur = c.id; save(); renderList(); renderMsgs(); closeSide(); };
    const x = document.createElement("button"); x.textContent = "✕"; x.title = "Удалить чат"; x.setAttribute("aria-label", "Удалить чат");
    x.onclick = () => { if (busy) return; S.chats = S.chats.filter(z => z.id !== c.id); if (S.cur === c.id) S.cur = null; save(); renderList(); renderMsgs(); };
    d.append(s, x); l.append(d);
  });
}
function botNode(m) {
  const row = document.createElement("div"); row.className = "m bot";
  row.innerHTML = `<div class="logo">✦</div><div class="w"><div class="who">Nova · ${esc(m.model || "")}</div><div class="b md"></div></div>`;
  paint(row, m, false);
  return row;
}
function paint(row, m, streaming) {
  const b = row.querySelector(".b"), w = row.querySelector(".w");
  w.querySelector(".act")?.remove();
  if (m.err) { b.className = "b err"; b.textContent = m.content; }
  else if (!m.content) { b.className = "b md"; b.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>'; }
  else { b.className = "b md"; b.innerHTML = md(m.content); }
  if (!streaming && m.content && !m.err) {
    const a = document.createElement("div"); a.className = "act";
    const c = document.createElement("button"); c.textContent = "Копировать";
    c.onclick = async () => { try { await navigator.clipboard.writeText(m.content.replace(/<think>[\s\S]*?<\/think>/g, "").trim()); toast("Скопировано"); } catch (e) { toast("Не удалось скопировать"); } };
    a.append(c); w.append(a);
  }
}
function renderMsgs() {
  const box = $("#msgs"), c = chat();
  box.innerHTML = "";
  if (!c || !c.messages.length) {
    const h = document.createElement("div"); h.className = "hero";
    h.innerHTML = `<div class="logo">✦</div><h1>Чем могу помочь?</h1><p>Я Nova. Стараюсь отвечать точно и обдуманно.</p><div class="chips"></div>`;
    ["Объясни простыми словами, как работает блокчейн", "Помоги составить план изучения английского", "Напиши функцию на Python для поиска простых чисел", "Придумай 5 идей для пет-проекта"].forEach(t => {
      const b = document.createElement("button"); b.className = "chip"; b.textContent = t; b.onclick = () => { $("#inp").value = t; send(); }; h.querySelector(".chips").append(b);
    });
    box.append(h); return;
  }
  const col = document.createElement("div"); col.className = "col";
  c.messages.forEach(m => {
    if (m.role === "user") { const r = document.createElement("div"); r.className = "m user"; const b = document.createElement("div"); b.className = "b"; b.textContent = m.content; r.append(b); col.append(r); }
    else col.append(botNode(m));
  });
  box.append(col); box.scrollTop = box.scrollHeight;
}

/* ---------- запрос к ИИ ---------- */
async function errText(r) {
  const t = await r.text(); let msg = t;
  try { const j = JSON.parse(t); msg = (j.error && j.error.message) || (j[0] && j[0].error && j[0].error.message) || t; } catch (e) {}
  let hint = "Ошибка запроса.";
  if (r.status === 400 && /api key|API_KEY/i.test(msg)) hint = "Ключ не подошёл. Проверь его в настройках.";
  else if (r.status === 401 || r.status === 403) hint = "Ключ не подошёл или у него нет доступа к этой модели.";
  else if (r.status === 404) hint = "Модель не найдена. Нажми ↻ и выбери другую.";
  else if (r.status === 429) hint = "Лимит бесплатного тарифа исчерпан. Подожди минуту или выбери другую модель или провайдера.";
  else if (r.status >= 500) hint = "Сервис ИИ временно недоступен. Попробуй ещё раз или выбери другую модель.";
  return hint + "\n\n(" + r.status + ") " + String(msg).slice(0, 300);
}
async function ask(hist, signal, onDelta) {
  const p = S.provider, m = S.model[p], k = S.keys[p].trim();
  let url, headers = {"Content-Type": "application/json"}, body;
  if (p === "gemini") {
    const gemma = /gemma/i.test(m);
    const contents = [];
    hist.forEach(x => {
      const role = x.role === "user" ? "user" : "model", last = contents[contents.length - 1];
      if (last && last.role === role) last.parts[0].text += "\n\n" + x.content; else contents.push({role, parts: [{text: x.content}]});
    });
    if (gemma) contents[0].parts[0].text = S.prompt + "\n\n" + contents[0].parts[0].text;
    body = {contents}; if (!gemma) body.systemInstruction = {parts: [{text: S.prompt}]};
    url = "https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(m) + ":streamGenerateContent?alt=sse&key=" + encodeURIComponent(k);
  } else {
    url = p === "groq" ? "https://api.groq.com/openai/v1/chat/completions" : "https://openrouter.ai/api/v1/chat/completions";
    headers.Authorization = "Bearer " + k;
    body = {model: m, stream: true, messages: [{role: "system", content: S.prompt}, ...hist]};
  }
  const r = await fetch(url, {method: "POST", headers, body: JSON.stringify(body), signal});
  if (!r.ok) throw new Error(await errText(r));
  const rd = r.body.getReader(), dec = new TextDecoder(); let buf = "";
  const line = l => {
    l = l.trim(); if (!l.startsWith("data:")) return;
    const d = l.slice(5).trim(); if (!d || d === "[DONE]") return;
    let j; try { j = JSON.parse(d); } catch (e) { return; }
    if (j.error) throw new Error(j.error.message || "Ошибка модели");
    let t = "";
    if (p === "gemini") t = ((j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || []).map(x => x.thought ? "" : (x.text || "")).join("");
    else t = (j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content) || "";
    if (t) onDelta(t);
  };
  for (;;) {
    const {done, value} = await rd.read(); if (done) break;
    buf += dec.decode(value, {stream: true});
    const parts = buf.split(/\r?\n/); buf = parts.pop(); parts.forEach(line);
  }
  buf += dec.decode(); if (buf) line(buf);
}

async function send() {
  if (busy) { ctrl && ctrl.abort(); return; }
  const inp = $("#inp"), text = inp.value.trim(); if (!text) return;
  const p = S.provider;
  if (!S.keys[p].trim()) { openSet(); toast("Сначала вставь ключ для «" + PROV[p].name + "»"); return; }
  let c = chat();
  if (!c) { c = {id: uid(), title: text.slice(0, 40), ts: Date.now(), messages: []}; S.chats.push(c); S.cur = c.id; }
  c.messages.push({role: "user", content: text});
  const bot = {role: "assistant", content: "", model: S.model[p]};
  c.messages.push(bot); c.ts = Date.now();
  inp.value = ""; inp.style.height = "auto";
  save(); renderList(); renderMsgs();
  const row = $("#msgs").querySelector(".m.bot:last-child"), box = $("#msgs");
  const hist = c.messages.slice(0, -1).filter(m => m.content && !m.err).map(m => ({role: m.role, content: m.content}));
  setBusy(true); ctrl = new AbortController();
  let raf = 0;
  const draw = () => { raf = 0; paint(row, bot, true); box.scrollTop = box.scrollHeight; };
  try {
    await ask(hist, ctrl.signal, t => { bot.content += t; if (!raf) raf = requestAnimationFrame(draw); });
    if (!bot.content.replace(/<think>[\s\S]*?(<\/think>|$)/g, "").trim()) { bot.err = true; bot.content = "Пустой ответ. Попробуй другую модель или переформулируй вопрос."; }
  } catch (e) {
    if (e.name === "AbortError") { if (!bot.content) { c.messages.pop(); } }
    else { bot.err = true; bot.content = e instanceof TypeError ? "Нет соединения или запрос заблокирован (проверь интернет и расширения-блокировщики)." : e.message; }
  }
  if (raf) cancelAnimationFrame(raf);
  setBusy(false); ctrl = null; save();
  if (c.messages.length && c.messages[c.messages.length - 1] === bot) paint(row, bot, false); else renderMsgs();
  box.scrollTop = box.scrollHeight;
}
function setBusy(b) { busy = b; const s = $("#send"); s.textContent = b ? "■" : "↑"; s.setAttribute("aria-label", b ? "Остановить" : "Отправить"); }

/* ---------- интерфейс ---------- */
function closeSide() { $("#side").classList.remove("open"); $("#scrim").classList.remove("open"); }
function openSet() {
  for (const k in PROV) $("#k_" + k).value = S.keys[k];
  $("#prompt").value = S.prompt; $("#ov").classList.add("on");
}
$("#menu").onclick = () => { $("#side").classList.add("open"); $("#scrim").classList.add("open"); };
$("#scrim").onclick = closeSide;
$("#newBtn").onclick = newChat;
$("#setBtn").onclick = () => { openSet(); closeSide(); };
$("#ov").onclick = e => { if (e.target.id === "ov") $("#ov").classList.remove("on"); };
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#ov").classList.remove("on"); });
$("#save").onclick = () => {
  const old = JSON.stringify(S.keys);
  for (const k in PROV) S.keys[k] = $("#k_" + k).value.trim();
  S.prompt = $("#prompt").value.trim() || DEFAULT_PROMPT;
  save(); $("#ov").classList.remove("on"); toast("Сохранено");
  if (old !== JSON.stringify(S.keys)) for (const k in PROV) if (S.keys[k]) loadModels(k, true);
};
$("#reset").onclick = () => { $("#prompt").value = DEFAULT_PROMPT; };
$("#wipe").onclick = () => {
  if (!confirm("Удалить ключи, чаты и настройки из этого браузера?")) return;
  try { localStorage.removeItem(LS); } catch (e) {}
  location.reload();
};
$("#prov").onchange = e => { S.provider = e.target.value; fillModels(); if (!LIST[S.provider]) loadModels(S.provider, true); };
$("#model").onchange = e => { S.model[S.provider] = e.target.value; save(); };
$("#refresh").onclick = () => loadModels(S.provider, false);
$("#send").onclick = send;
const inp = $("#inp");
inp.addEventListener("input", () => { inp.style.height = "auto"; inp.style.height = Math.min(inp.scrollHeight, 200) + "px"; });
inp.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });

fillProv(); fillModels(); renderList(); renderMsgs();
for (const k in PROV) if (S.keys[k] || k === "openrouter") loadModels(k, true);
</script>
